version: "3.9"

services:
  face-ai-backend:
    container_name: face-ai-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models
      - ./weights:/app/weights
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - APP_HOST=0.0.0.0
      - APP_PORT=5000
    restart: unless-stopped